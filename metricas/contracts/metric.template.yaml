quality:
  minimum_coverage: 0.90
  # Ramas de captura sobre las que se evalúa la cobertura POR SEPARADO.
  # Una métrica cuyo denominador mezcla una rama instrumentada con una ciega
  # es falsa aunque el promedio pase el umbral.
  coverage_segments: []
  minimum_sample: 30
  maximum_latency_minutes: 1440
  on_insufficient_data: no_medible
  # Qué se muestra en pantalla junto al número, siempre.
  display_with_coverage: true

